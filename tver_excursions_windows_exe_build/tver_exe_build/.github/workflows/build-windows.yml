name: Build TverGuide for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --name TverGuide --add-data "templates;templates" --add-data "static;static" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TverGuide-Windows
          path: dist/TverGuide.exe



