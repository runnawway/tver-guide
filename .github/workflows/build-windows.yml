name: Build TverGuide for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd tver_excursions_windows_exe_build/tver_exe_build
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          cd tver_excursions_windows_exe_build/tver_exe_build
          pyinstaller --noconfirm --clean --onefile --name TverGuide --add-data "templates;templates" --add-data "static;static" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TverGuide-Windows
          path: tver_excursions_windows_exe_build/tver_exe_build/dist/TverGuide.exe
